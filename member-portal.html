<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Portal — Attire | NYC Sustainable Fashion Network</title>
<meta name="description" content="Attire's member portal — post updates, browse sourcing RFPs on the deal board, and message other members directly.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23699973%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=31">
</head>
<body class="portal-page">

<div class="app-shell">
  <aside class="app-sidebar">
    <a href="index.html" class="app-sidebar-logo">
      <span class="logo-mark" aria-hidden="true">Aa</span>
      <span class="app-sidebar-logo-word">Attire</span>
    </a>

    <nav class="app-sidebar-nav" aria-label="Portal">
      <button type="button" class="app-sidebar-link is-active" data-view="feed" data-filter="all">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
        <span>Feed</span>
      </button>
      <button type="button" class="app-sidebar-link" data-view="deal" data-filter="deal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Deal Board</span>
      </button>
      <button type="button" class="app-sidebar-link" data-view="sourcing" data-filter="sourcing">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Sourcing</span>
      </button>
      <a href="pooling.html" class="app-sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Pooling</span>
      </a>
      <a href="intros.html" class="app-sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>
        <span>Intros</span>
      </a>
      <a href="notifications.html" class="app-sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Notifications</span>
      </a>
      <a href="directory.html" class="app-sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Directory</span>
      </a>
    </nav>

    <div class="app-sidebar-spacer"></div>

    <a href="profile.html" class="app-sidebar-account">
      <span class="portal-avatar" id="sidebar-account-avatar" aria-hidden="true"></span>
      <span>
        <span class="app-sidebar-account-name" id="sidebar-account-name"></span>
        <span class="app-sidebar-account-sub" id="sidebar-account-sub"></span>
      </span>
    </a>
    <a href="index.html" class="app-sidebar-logout" data-action="logout">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      <span>Log Out</span>
    </a>
  </aside>

  <div class="app-body">
    <header class="app-topbar">
      <div class="app-topbar-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="feed-search" placeholder="Search the feed&hellip;" aria-label="Search the feed">
      </div>
      <div class="app-topbar-spacer"></div>
      <div class="app-topbar-actions">
        <button type="button" class="app-topbar-icon" id="topbar-messages-btn" aria-label="Messages">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span class="app-topbar-icon-badge" id="topbar-messages-badge" hidden></span>
        </button>
        <button type="button" class="app-topbar-icon" id="topbar-notif-btn" aria-label="Notifications">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="app-topbar-icon-badge" id="topbar-notif-badge" hidden></span>
        </button>
      </div>

      <div class="app-dropdown" id="messages-dropdown" hidden>
        <div class="app-dropdown-head">Messages</div>
        <div id="messages-dropdown-list"></div>
      </div>
      <div class="app-dropdown" id="notifications-dropdown" hidden>
        <div class="app-dropdown-head">Notifications</div>
        <div id="notifications-dropdown-list"></div>
      </div>
    </header>

    <div class="app-content app-content--rows">
      <aside class="app-list">
        <div class="app-list-section-label">Direct Messages</div>
        <div id="chat-thread-list"></div>
      </aside>

      <main class="app-main" id="app-main">
        <div id="view-feed">
          <form class="composer-card" id="composer-form">
            <div class="form-field" style="margin-bottom:0.75rem;">
              <label for="composer-post-type">Post type (required)</label>
              <select id="composer-post-type" required>
                <option value="">Select one&hellip;</option>
                <option value="deal_board_rfp">Deal Board RFP</option>
                <option value="sourcing">Sourcing</option>
              </select>
            </div>
            <div class="composer-top">
              <span class="portal-avatar" id="composer-avatar" aria-hidden="true"></span>
              <textarea class="composer-textarea" id="composer-textarea" placeholder="Describe what you're looking for&hellip;" required></textarea>
            </div>
            <div class="form-grid" style="margin:0.75rem 0;">
              <div class="form-field">
                <label for="composer-category">Category</label>
                <input type="text" id="composer-category" placeholder="e.g. cut-and-sew">
              </div>
              <div class="form-field">
                <label for="composer-scope">Scope / quantity</label>
                <input type="text" id="composer-scope" placeholder="e.g. 200-unit run">
              </div>
              <div class="form-field">
                <label for="composer-budget">Budget range</label>
                <input type="text" id="composer-budget" placeholder="e.g. $2k&ndash;$4k">
              </div>
              <div class="form-field">
                <label for="composer-deadline">Deadline</label>
                <input type="date" id="composer-deadline">
              </div>
            </div>
            <p class="login-error" id="composer-error" hidden></p>
            <div class="composer-actions">
              <span class="app-topbar-spacer"></span>
              <button type="submit" class="btn btn-primary btn-sm">Post</button>
            </div>
          </form>

          <div class="composer-card composer-locked" id="composer-locked" hidden style="margin-top:var(--space-3);">
            <p><strong>The Deal Board is a member perk.</strong> Upgrade to Individual or Organization to post and respond to RFPs.</p>
            <a href="upgrade.html" class="btn btn-primary btn-sm">Upgrade Plan</a>
          </div>

          <div id="portal-feed-list" style="margin-top:var(--space-3); display:flex; flex-direction:column; gap:var(--space-3);"></div>
        </div>

        <div id="view-chat" hidden>
          <div class="chat-conversation">
            <div class="chat-conversation-head">
              <button type="button" class="chat-back" id="chat-back" aria-label="Back to feed" style="background:none;border:none;color:#B9CCB8;cursor:pointer;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <span class="portal-avatar" id="chat-view-avatar" aria-hidden="true"></span>
              <h2 id="chat-view-name"></h2>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <form class="chat-compose" id="chat-compose-form">
              <input type="text" id="chat-input" placeholder="Write a message&hellip;" aria-label="Write a message" required>
              <button type="submit" class="icon-btn" aria-label="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>
              </button>
            </form>
          </div>
        </div>
      </main>

      <aside class="app-context" id="app-context">
        <div id="context-feed">
          <h3>Suggested Members</h3>
          <div id="context-members-list"></div>
        </div>
        <div id="context-chat" hidden></div>
      </aside>
    </div>
  </div>
</div>

<!-- Member login modal (unused here, kept for markup parity) -->

<script src="data.js?v=1"></script>
<script src="portal-data.js?v=3"></script>
<script src="profile-data.js?v=3"></script>
<script src="script.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=1"></script>
<script src="auth.js?v=4"></script>
<script src="shell.js?v=2"></script>
<script src="portal.js?v=5"></script>
</body>
</html>
